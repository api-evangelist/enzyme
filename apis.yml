aid: enzyme
name: Enzyme
description: >-
  Enzyme is a cloud-based electronic Quality Management System (eQMS) for the
  life sciences, serving medical device, digital health, and biopharma companies.
  The platform is 21 CFR Part 11 compliant and validated out-of-box, spanning the
  full product lifecycle: document control, change control, and training as core
  functions; design control, risk management, and supplier management for premarket;
  and audits, complaints, nonconformance, and CAPA for postmarket. It integrates
  with enterprise tools including Microsoft Office 365, Slack, Salesforce, Jira,
  GitHub, GitLab, Google Workspace, and Jenkins, and is designed to scale from
  startup through IPO-stage organizations. Enzyme was surfaced as a portfolio
  company of DCVC (Data Collective) and was acquired by Greenlight Guru.
